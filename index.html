<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d3257"><meta name="apple-mobile-web-app-capable" content="yes"><title>SAHMT</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="shell.css"><link rel="stylesheet" href="modal-98.css"></head><body>
<div id="boot-screen" role="status" aria-live="polite"><div class="boot-card"><img src="icons/icon-192.png" width="76" height="76" alt="SAHMT"><strong>SAHMT</strong><span id="boot-message">Iniciando o aplicativo…</span><i aria-hidden="true"></i></div></div><main id="app"></main><style id="boot-style">#boot-screen{position:fixed;inset:0;z-index:20000;display:grid;place-items:center;background:#0d3257;color:#fff;font-family:system-ui,sans-serif}#boot-screen[hidden]{display:none}#boot-screen .boot-card{display:grid;justify-items:center;gap:10px;width:min(86vw,330px);padding:28px 22px;border-radius:24px;background:linear-gradient(145deg,#fff,#e5f0f5);color:#0d3257;box-shadow:0 20px 60px #001b3566;text-align:center}#boot-screen img{border-radius:18px;box-shadow:0 6px 15px #0d325733}#boot-screen strong{font-size:1.35rem;letter-spacing:.08em}#boot-screen span{font-size:.8rem;line-height:1.35;color:#526578}#boot-screen i{width:28px;height:28px;border:3px solid #c6d6e6;border-top-color:#18b7b7;border-radius:50%;animation:sahmt-boot-spin .8s linear infinite}@keyframes sahmt-boot-spin{to{transform:rotate(360deg)}}</style>
<section id="login-gate" aria-label="Acesso ao SAHMT"><div class="login-card"><img src="icons/icon-192.png" width="76" height="76" alt="SAHMT"><h1>SAHMT</h1><p id="login-status" role="status">Restaurando sua conta…</p><div id="google-login"><button id="google-login-button" hidden>Entrar com Google</button></div><button id="auth-retry" hidden>Tentar novamente sem sair</button><button id="auth-change-account" hidden>Sair ou trocar conta</button><small>Uma única conta para acessar as áreas do SAHMT, conforme suas permissões.</small></div></section>
<div id="shell-state" hidden><p id="shell-status" role="status"></p><button id="shell-retry" hidden>Tentar novamente</button><button id="shell-update" hidden>Atualizar aplicativo</button><button id="account-button" hidden>Conta e envios</button></div>
<dialog id="account-dialog"><h2>Conta e envios</h2><p id="account-email"></p><p id="pending-status" role="status"></p><ul id="pending-list"></ul><button id="pending-send">Tentar enviar pendentes</button><button id="account-exit">Sair ou trocar conta</button><button id="account-close">Fechar</button></dialog>
<dialog id="update-dialog" hidden data-startup-locked aria-labelledby="update-title"><h2 id="update-title">Atualização do SAHMT</h2><p id="update-status" role="status">Salve os dados em edição antes de atualizar. Sua conta e os envios pendentes serão preservados.</p><button id="update-apply">Atualizar agora</button><button id="update-later">Continuar usando</button></dialog>
<script type="module" src="core/app.js"></script></body></html>
