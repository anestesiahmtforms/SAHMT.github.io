<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d3257"><meta name="apple-mobile-web-app-capable" content="yes"><title>SAHMT</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><link rel="stylesheet" href="shell.css"></head><body>
<main id="app"></main>
<section id="login-gate" aria-label="Acesso ao SAHMT"><div class="login-card"><img src="icons/icon-192.png" width="76" height="76" alt="SAHMT"><h1>SAHMT</h1><p id="login-status" role="status">Entre com sua conta Google autorizada.</p><div id="google-login"></div><small>Ambiente de construção. Não substitui o aplicativo atual.</small></div></section>
<div id="shell-state"><p id="shell-status" role="status">Preparando o SAHMT…</p><button id="shell-retry" hidden>Tentar novamente</button><button id="shell-update" hidden>Atualizar aplicativo</button><button id="account-button" hidden>Conta e envios</button></div>
<dialog id="account-dialog"><h2>Conta e envios</h2><p id="account-email"></p><p id="pending-status" role="status"></p><ul id="pending-list"></ul><button id="pending-send">Tentar enviar pendentes</button><button id="account-exit">Sair ou trocar conta</button><button id="account-close">Fechar</button></dialog>
<script type="module" src="core/app.js"></script></body></html>
